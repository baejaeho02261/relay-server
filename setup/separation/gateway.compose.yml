# Run on the designated host only. Not automatically applied to Railway.
services:
  gateway:
    image: ${GATEWAY_IMAGE:?set reviewed gateway-only image digest}
    user: 10002:10002
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: 'no'
    environment:
      NODE_ENV: production
      DATA_DIR: ''
      GAME_ISOLATION_REQUIRED: '1'
      GAME_SERVICE_ROLE: gateway
      GAME_SERVICE_UID: '10002'
      GAME_READONLY_PATHS_JSON: '["/app"]'
      GAME_FORBIDDEN_PATHS_JSON: '["/data","/keys-release","/keys-ci"]'
      GAME_WRITABLE_PATHS_JSON: '[]'
      GATEWAY_MODE: direct
      PORT: ${PORT:?set listener port}
      GATEWAY_HOST: ${GATEWAY_HOST:?set listener bind address}
      GATEWAY_PUBLIC_CERT_FILE: /tls/public.crt
      GATEWAY_PUBLIC_KEY_FILE: /tls/public.key
      GATEWAY_CA_FILE: /tls/authority-ca.crt
      GATEWAY_CERT_FILE: /tls/gateway.crt
      GATEWAY_KEY_FILE: /tls/gateway.key
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002,mode=700
    env_file:
    - ./gateway.env
    command:
    - node
    - tools/web/peace.admin-gateway.js
    ports:
    - "${GATEWAY_BIND_IP:?set bind address}:${PORT:?set listener port}:${PORT:?set listener port}"
    volumes:
    - type: bind
      source: ${GATEWAY_TLS_DIR:?existing gateway-only certificates}
      target: /tls
      read_only: true
      bind:
        create_host_path: false
