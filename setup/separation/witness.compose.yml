# Run on the designated host only. Not automatically applied to Railway.
services:
  witness:
    image: ${GAMEWEB_IMAGE:?set reviewed Relay Server image digest}
    user: 10004:10004
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: 'no'
    environment:
      NODE_ENV: production
      DATA_DIR: ''
      GAME_ISOLATION_REQUIRED: '1'
      GAME_SERVICE_ROLE: witness
      GAME_SERVICE_UID: '10004'
      GAME_READONLY_PATHS_JSON: '["/app"]'
      GAME_FORBIDDEN_PATHS_JSON: '["/data","/keys-release"]'
      GAME_WRITABLE_PATHS_JSON: '["/witness"]'
      WITNESS_DATA_DIR: /witness
      WITNESS_PORT: ${WITNESS_PORT:?set listener port}
      WITNESS_HOST: ${WITNESS_HOST:?set listener bind address}
      WITNESS_CA_FILE: /tls/authority-client-ca.crt
      WITNESS_CERT_FILE: /tls/witness.crt
      WITNESS_KEY_FILE: /tls/witness.key
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10004,gid=10004,mode=700
    env_file:
    - ./witness.env
    command:
    - node
    - tools/recovery/peace.recovery-witness-server.js
    ports:
    - "${WITNESS_PRIVATE_IP:?set bind address}:${WITNESS_PORT:?set listener port}:${WITNESS_PORT:?set listener port}"
    volumes:
    - type: bind
      source: ${WITNESS_STORE_DIR:?pre-enrolled independent witness store}
      target: /witness
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${WITNESS_TLS_DIR:?witness-only certificates}
      target: /tls
      read_only: true
      bind:
        create_host_path: false
