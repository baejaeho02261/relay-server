<body>

  <div class="space-sky" aria-hidden="true"></div>
  <section id="login-screen" class="login-screen" aria-label="SpaceX 로그인">
    <div class="login-layout">
      <div class="login-story">
        <div class="login-brand">
          <img src="/icons/game.svg" alt="" class="brand-symbol" width="44" height="44">
          <h1 class="login-wordmark">SpaceX</h1>
        </div>
        <div class="login-planet" aria-hidden="true">
          <img src="/icons/earth.svg" alt="" width="680" height="600" fetchpriority="high">
        </div>
      </div>
      <div class="space-login-controls">
        <button type="button" class="icon-btn motion-toggle" data-motion-toggle aria-pressed="false" aria-label="애니메이션 끄기" title="애니메이션 끄기">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M8 5v14M16 5v14"/></svg>
          <span class="sr-only" data-motion-label>애니메이션 끄기</span>
        </button>
      </div>
      <div class="login-card">
        <h2>워크스페이스 로그인</h2>
        <form id="login-form" autocomplete="off">
          <label for="login-role">접근 역할<select id="login-role"><option value="admin">관리자</option><option value="operator">운영자</option><option value="viewer">조회 전용</option></select></label>
          <label for="login-password">비밀번호<input id="login-password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required></label>
          <button class="primary wide" type="submit">로그인 <svg class="aurora-link-arrow" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12 12 4M5 4h7v7"/></svg></button>
          <div class="login-divider"><span>또는</span></div>
          <button id="passkey-login-btn" class="ghost wide" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><circle cx="8" cy="10" r="4"/><path d="m11 13 8 0m-3 0v3m3-3v2"/></svg>패스키로 로그인</button>
          <p class="small-note">등록된 패스키가 있다면 비밀번호 없이 로그인할 수 있습니다.</p>
        </form>
        <div id="login-error" class="form-error" role="alert" aria-live="polite"></div>
        <div class="login-security-note"><svg viewBox="0 0 24 24" aria-hidden="true" width="15" height="15"><path d="m12 3 7 3v5c0 5-7 9-7 9s-7-4-7-9V6z"/></svg>권한이 부여된 운영자만 접근할 수 있습니다.</div>
      </div>
    </div>
  </section>
  <div id="app" class="app hidden">

      <header class="sidebar-brand">
        <img class="brand-symbol" src="/icons/game.svg" alt="" width="42" height="42">

        <button id="rail-close" class="icon-btn" type="button" aria-controls="main-menu" aria-label="사이드바 접기" title="사이드바 접기"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 5v14m7-10-3 3 3 3"/></svg></button>

            <button type="button" data-view="monitor"><span class="nav-label">연결 상태</span></button>

        <details class="nav-group">
          <summary><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4 2.6 7.5 7 10 4.4-2.5 7-6 7-10V6zM9 12l2 2 4-4"/></svg>보안 · 정책</summary>

            <button type="button" data-view="security"><span class="nav-label">보안 상태</span></button>

        </details>

        </section>
        <div class="aurora-rail-facts"><div><span>접속 중 서버</span><strong id="aurora-rail-servers">—</strong></div><div><span id="aurora-rail-activity-label">확인할 알림</span><strong id="aurora-rail-alerts">—</strong><svg id="aurora-rail-spark" viewBox="0 0 120 28" aria-hidden="true" hidden><polyline/></svg></div></div>
